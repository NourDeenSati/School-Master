plugins {
    id "com.android.application"
    // استخدم معرف كوتلن الحديث (بدل kotlin-android)
    id "org.jetbrains.kotlin.android"
    // يجب تطبيقه بعد Android/Kotlin
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.school_mangmante"

    // ارفع الـ SDK حتى تتوافق كل الإضافات التي عندك
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    defaultConfig {
        applicationId = "com.example.school_mangmante"

        // اتركها من Flutter إن رغبت، لكن تأكد أن targetSdk مناسب
        minSdk = flutter.minSdkVersion
        targetSdk = 36

        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // AGP 8.x يحتاج Java 17
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        debug {
            // عادة لا نفعل التقليل في Debug
            minifyEnabled false
        }
        release {
            // فعّل تقليل الشفرة وتقليص الموارد في الإصدارات النهائية
            minifyEnabled true
            shrinkResources true

            // هذا هو السطر الذي طلبته (مع ملف الـ optimize الأحدث)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'

            // مؤقتًا نستخدم توقيع debug حتى تجهّز توقيع release
            signingConfig signingConfigs.debug
        }
    }

    // لو عندك buildFeatures أو packagingOptions أبقها كما هي
}

flutter {
    source = "../.."
}

